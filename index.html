<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordSpeller - 单词拼写复习</title>
<style>
:root {
  --primary: #4f46e5;
  --primary-light: #818cf8;
  --primary-dark: #3730a3;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px;
}
/* Header */
.header {
  text-align: center;
  padding: 24px 0 16px;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
}
.header p {
  color: var(--text-secondary);
  font-size: 14px;
}
/* View switching */
.view { display: none; }
.view.active { display: block; }
/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}
/* Level grid */
.level-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.level-btn {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.level-btn:hover { border-color: var(--primary-light); }
.level-btn.selected {
  border-color: var(--primary);
  background: #eef2ff;
  color: var(--primary);
}
.level-btn .count {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-top: 4px;
}
/* Mode grid */
.mode-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.mode-btn {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.mode-btn:hover { border-color: var(--primary-light); }
.mode-btn.selected {
  border-color: var(--primary);
  background: #eef2ff;
}
.mode-btn .icon { font-size: 24px; margin-bottom: 8px; }
.mode-btn .label { font-size: 14px; font-weight: 600; }
.mode-btn .desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 24px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: #e2e8f0; }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
/* Quiz area */
.quiz-progress {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--text-secondary);
}
.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin: 0 12px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s;
}
.word-display {
  text-align: center;
  padding: 24px 16px;
  margin-bottom: 16px;
}
.word-meaning {
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.word-hint {
  font-size: 14px;
  color: var(--text-secondary);
}
.word-en {
  font-size: 32px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 1px;
}
.input-area {
  margin-bottom: 16px;
}
.word-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 18px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
  text-transform: lowercase;
}
.word-input:focus { border-color: var(--primary); }
.word-input.correct { border-color: var(--success); background: #ecfdf5; }
.word-input.wrong { border-color: var(--danger); background: #fef2f2; }
/* Options */
.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.option-btn {
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  font-size: 15px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
}
.option-btn:hover { border-color: var(--primary-light); }
.option-btn.correct { border-color: var(--success); background: #ecfdf5; }
.option-btn.wrong { border-color: var(--danger); background: #fef2f2; }
.option-btn:disabled { cursor: default; }
/* Feedback */
.feedback {
  text-align: center;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  font-weight: 500;
  display: none;
}
.feedback.show { display: block; }
.feedback.correct { background: #ecfdf5; color: var(--success); }
.feedback.wrong { background: #fef2f2; color: var(--danger); }
.feedback .answer { font-weight: 700; }
/* Stats */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.stat-item {
  text-align: center;
  padding: 12px;
  background: var(--bg);
  border-radius: 8px;
}
.stat-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}
.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
}
/* Nav */
.nav-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
}
.nav-tab {
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: var(--card);
  border: 1px solid var(--border);
  white-space: nowrap;
  transition: all 0.2s;
}
.nav-tab.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
/* Word list */
.word-list {
  max-height: 400px;
  overflow-y: auto;
}
.word-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.word-item:last-child { border-bottom: none; }
.word-item .en { font-weight: 600; font-size: 15px; }
.word-item .zh { font-size: 13px; color: var(--text-secondary); }
.word-item .del-btn {
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 18px;
  padding: 4px 8px;
}
/* Speaker button */
.speaker-btn {
  background: none;
  border: none;
  font-size: 28px;
  cursor: pointer;
  padding: 8px;
  vertical-align: middle;
}
/* Result screen */
.result-screen {
  text-align: center;
  padding: 32px 16px;
}
.result-score {
  font-size: 48px;
  font-weight: 700;
  color: var(--primary);
  margin: 16px 0;
}
.result-detail {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 24px;
}
/* Bottom nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  z-index: 100;
}
.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 16px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 11px;
  gap: 2px;
}
.bottom-nav-item.active { color: var(--primary); }
.bottom-nav-item .nav-icon { font-size: 20px; }
body { padding-bottom: 70px; }
/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
@media (min-width: 768px) {
  .level-grid { grid-template-columns: repeat(3, 1fr); }
  .mode-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>
<div class="container">
  <!-- ===== 首页视图 ===== -->
  <div id="view-home" class="view active">
    <div class="header">
      <h1>WordSpeller</h1>
      <p>四级 / 六级 / 专四 / 专八 / 雅思 单词拼写复习</p>
    </div>
    <div class="card">
      <div class="card-title">1. 选择题库</div>
      <div class="level-grid" id="levelGrid"></div>
    </div>
    <div class="card">
      <div class="card-title">2. 选择模式</div>
      <div class="mode-grid" id="modeGrid"></div>
    </div>
    <button class="btn btn-primary btn-block" id="startBtn" disabled>开始练习</button>
  </div>

  <!-- ===== 练习视图 ===== -->
  <div id="view-quiz" class="view">
    <div class="card">
      <div class="quiz-progress">
        <span id="progressText">1 / 10</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 10%"></div></div>
        <span id="scoreText">0 分</span>
      </div>
      <div class="word-display" id="quizDisplay"></div>
      <div class="input-area" id="quizInputArea"></div>
      <div class="options-grid" id="quizOptions"></div>
      <div class="feedback" id="quizFeedback"></div>
      <button class="btn btn-primary btn-block" id="nextBtn" style="display:none">下一题</button>
    </div>
  </div>

  <!-- ===== 结果视图 ===== -->
  <div id="view-result" class="view">
    <div class="card result-screen">
      <div style="font-size:48px">🎉</div>
      <h2 style="margin:16px 0 8px">练习完成！</h2>
      <div class="result-score" id="resultScore">0 / 10</div>
      <div class="result-detail" id="resultDetail"></div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="restartQuiz()">再来一轮</button>
        <button class="btn btn-secondary" onclick="goHome()">返回首页</button>
      </div>
    </div>
  </div>

  <!-- ===== 错词本视图 ===== -->
  <div id="view-mistakes" class="view">
    <div class="header">
      <h1>错词本</h1>
      <p id="mistakeCount">0 个错词</p>
    </div>
    <div class="card">
      <div class="word-list" id="mistakeList">
        <div style="text-align:center;color:var(--text-secondary);padding:40px 0;font-size:14px">暂无错词，继续保持！</div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="practiceMistakesBtn">练习错词本</button>
  </div>

  <!-- ===== 统计视图 ===== -->
  <div id="view-stats" class="view">
    <div class="header">
      <h1>学习统计</h1>
    </div>
    <div class="card">
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-label">总练习数</div>
        </div>
        <div class="stat-item">
          <div class="stat-num" id="statCorrect">0</div>
          <div class="stat-label">正确数</div>
        </div>
        <div class="stat-item">
          <div class="stat-num" id="statRate">0%</div>
          <div class="stat-label">正确率</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">各题库掌握情况</div>
      <div id="levelStats"></div>
    </div>
  </div>
</div>

<!-- Bottom nav -->
<div class="bottom-nav">
  <div class="bottom-nav-item active" data-view="home" onclick="switchTab('home')">
    <span class="nav-icon">🏠</span><span>首页</span>
  </div>
  <div class="bottom-nav-item" data-view="mistakes" onclick="switchTab('mistakes')">
    <span class="nav-icon">📝</span><span>错词本</span>
  </div>
  <div class="bottom-nav-item" data-view="stats" onclick="switchTab('stats')">
    <span class="nav-icon">📊</span><span>统计</span>
  </div>
</div>

<div class="toast" id="toast"></div>

// ===== 模式定义 =====
const MODES = {
  spelling: { label: '拼写练习', icon: '✏️', desc: '看中文写英文' },
  dictation: { label: '听写模式', icon: '🔊', desc: '听发音写英文' },
 默写: { label: '默写模式', icon: '📖', desc: '看英文选中文' },
  choice: { label: '选择题', icon: '🎯', desc: '四选一选答案' }
};

// ===== 状态 =====
let state = {
  level: null,
  mode: null,
  words: [],
  currentIndex: 0,
  score: 0,
  mistakes: [],
  answered: false,
  practiceMistakesOnly: false
};

// ===== 存储 =====
const STORAGE_KEY = 'wordspeller_data';
function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { mistakes: [], stats: { total: 0, correct: 0, byLevel: {} } };
  } catch { return { mistakes: [], stats: { total: 0, correct: 0, byLevel: {} } }; }
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
let appData = loadData();

// ===== 初始化 =====
function init() {
  renderLevels();
  renderModes();
  updateStartBtn();
}

function renderLevels() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  for (const [key, bank] of Object.entries(WORD_BANKS)) {
    const btn = document.createElement('div');
    btn.className = 'level-btn' + (state.level === key ? ' selected' : '');
    btn.innerHTML = `${bank.name}<span class="count">${bank.words.length} 词</span>`;
    btn.onclick = () => {
      state.level = key;
      renderLevels();
      updateStartBtn();
    };
    grid.appendChild(btn);
  }
}

function renderModes() {
  const grid = document.getElementById('modeGrid');
  grid.innerHTML = '';
  for (const [key, mode] of Object.entries(MODES)) {
    const btn = document.createElement('div');
    btn.className = 'mode-btn' + (state.mode === key ? ' selected' : '');
    btn.innerHTML = `<div class="icon">${mode.icon}</div><div class="label">${mode.label}</div><div class="desc">${mode.desc}</div>`;
    btn.onclick = () => {
      state.mode = key;
      renderModes();
      updateStartBtn();
    };
    grid.appendChild(btn);
  }
}

function updateStartBtn() {
  document.getElementById('startBtn').disabled = !(state.level && state.mode);
}

// ===== 视图切换 =====
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.bottom-nav-item').forEach(t => t.classList.remove('active'));
  const navMap = { home: 'home', mistakes: 'mistakes', stats: 'stats' };
  if (navMap[name]) {
    document.querySelector(`.bottom-nav-item[data-view="${navMap[name]}"]`)?.classList.add('active');
  }
  window.scrollTo(0, 0);
}

function switchTab(view) {
  if (view === 'mistakes') renderMistakes();
  if (view === 'stats') renderStats();
  showView(view);
}

function goHome() {
  showView('home');
}

// ===== 开始练习 =====
document.getElementById('startBtn').onclick = () => {
  // 解锁语音合成：浏览器自动播放策略需要用户先有交互
  unlockAudio();
  startQuiz(false);
};

function unlockAudio() {
  if ('speechSynthesis' in window) {
    // 先播放一个空的语音，解锁音频系统
    const utter = new SpeechSynthesisUtterance('');
    utter.volume = 0;
    speechSynthesis.speak(utter);
    // 预加载 voices
    speechSynthesis.getVoices();
  }
}

function startQuiz(mistakesOnly) {
  state.practiceMistakesOnly = mistakesOnly;
  if (mistakesOnly) {
    state.words = appData.mistakes.map(m => ({ en: m.en, zh: m.zh }));
  } else {
    const bank = WORD_BANKS[state.level];
    state.words = shuffle([...bank.words]).slice(0, 10);
  }
  state.currentIndex = 0;
  state.score = 0;
  state.mistakes = [];
  showView('quiz');
  renderQuestion();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== 渲染题目 =====
function renderQuestion() {
  const word = state.words[state.currentIndex];
  state.answered = false;
  const total = state.words.length;
  const idx = state.currentIndex + 1;

  document.getElementById('progressText').textContent = `${idx} / ${total}`;
  document.getElementById('progressFill').style.width = `${(idx / total) * 100}%`;
  document.getElementById('scoreText').textContent = `${state.score} 分`;

  const display = document.getElementById('quizDisplay');
  const inputArea = document.getElementById('quizInputArea');
  const optionsArea = document.getElementById('quizOptions');
  const feedback = document.getElementById('quizFeedback');
  const nextBtn = document.getElementById('nextBtn');

  feedback.className = 'feedback';
  feedback.innerHTML = '';
  nextBtn.style.display = 'none';

  if (state.mode === 'spelling') {
    // 看中文写英文
    display.innerHTML = `<div class="word-meaning">${word.zh}</div><div class="word-hint">请拼写对应的英文单词</div>`;
    inputArea.innerHTML = `<input type="text" class="word-input" id="wordInput" placeholder="输入英文单词" autocomplete="off">`;
    optionsArea.innerHTML = '';
    const input = document.getElementById('wordInput');
    input.focus();
    input.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
    // 自动发音
    setTimeout(() => speakWord(), 300);
  } else if (state.mode === 'dictation') {
    // 听写模式：显示词性和释义作为提示，听发音写单词
    display.innerHTML = `<div class="word-meaning">${word.zh}</div>
      <div class="word-hint">听发音，写出对应的英文单词</div>
      <button class="speaker-btn" onclick="speakWord()">🔊</button>`;
    inputArea.innerHTML = `<input type="text" class="word-input" id="wordInput" placeholder="输入听到的单词" autocomplete="off">`;
    optionsArea.innerHTML = '';
    const input = document.getElementById('wordInput');
    input.focus();
    input.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
    // 自动播放发音
    setTimeout(() => speakWord(), 300);
  } else if (state.mode === '默写') {
    // 看英文选中文
    display.innerHTML = `<div class="word-en">${word.en}</div><div class="word-hint">选择正确的中文释义</div>`;
    inputArea.innerHTML = '';
    optionsArea.innerHTML = '';
    const options = generateOptions(word, 'zh');
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => checkChoice(btn, opt, word.zh);
      optionsArea.appendChild(btn);
    });
    // 自动发音
    setTimeout(() => speakWord(), 300);
  } else if (state.mode === 'choice') {
    // 选择题：看中文选英文
    display.innerHTML = `<div class="word-meaning">${word.zh}</div><div class="word-hint">选择正确的英文单词</div>`;
    inputArea.innerHTML = '';
    optionsArea.innerHTML = '';
    const options = generateOptions(word, 'en');
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => checkChoice(btn, opt, word.en);
      optionsArea.appendChild(btn);
    });
    // 自动发音
    setTimeout(() => speakWord(), 300);
  }
}

function generateOptions(correctWord, field) {
  const options = [correctWord[field]];
  const bankWords = WORD_BANKS[state.level].words;
  const others = shuffle(bankWords.filter(w => w[field] !== correctWord[field])).slice(0, 3);
  others.forEach(w => options.push(w[field]));
  return shuffle(options);
}

function speakWord() {
  const word = state.words[state.currentIndex];
  if ('speechSynthesis' in window) {
    const utter = new SpeechSynthesisUtterance(word.en);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    utter.pitch = 1;
    utter.volume = 1;
    // 选择美音 voice
    let voices = speechSynthesis.getVoices();
    if (voices.length === 0) {
      // voices 还没加载，等待一下
      setTimeout(() => speakWord(), 100);
      return;
    }
    const usVoice = voices.find(v => v.lang === 'en-US' && v.localService) || 
                    voices.find(v => v.lang === 'en-US') ||
                    voices.find(v => v.lang.startsWith('en'));
    if (usVoice) utter.voice = usVoice;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  } else {
    showToast('当前浏览器不支持语音播放');
  }
}

// ===== 检查答案 =====
function checkAnswer() {
  if (state.answered) return;
  const word = state.words[state.currentIndex];
  const input = document.getElementById('wordInput');
  const userVal = input.value.trim().toLowerCase();
  const correctVal = word.en.toLowerCase();

  state.answered = true;
  const feedback = document.getElementById('quizFeedback');
  const nextBtn = document.getElementById('nextBtn');

  if (userVal === correctVal) {
    input.classList.add('correct');
    state.score++;
    feedback.className = 'feedback show correct';
    feedback.innerHTML = `✓ 回答正确！<span class="answer">${word.en}</span> — ${word.zh}`;
    updateStats(true);
  } else {
    input.classList.add('wrong');
    feedback.className = 'feedback show wrong';
    feedback.innerHTML = `✗ 正确答案：<span class="answer">${word.en}</span> — ${word.zh}`;
    addToMistakes(word);
    updateStats(false);
  }

  document.getElementById('scoreText').textContent = `${state.score} 分`;
  nextBtn.style.display = 'block';
  nextBtn.textContent = state.currentIndex >= state.words.length - 1 ? '查看结果' : '下一题';
}

function checkChoice(btn, userVal, correctVal) {
  if (state.answered) return;
  const word = state.words[state.currentIndex];
  state.answered = true;
  const feedback = document.getElementById('quizFeedback');
  const nextBtn = document.getElementById('nextBtn');

  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === correctVal) b.classList.add('correct');
  });

  if (userVal === correctVal) {
    state.score++;
    feedback.className = 'feedback show correct';
    feedback.innerHTML = `✓ 回答正确！<span class="answer">${word.en}</span> — ${word.zh}`;
    updateStats(true);
  } else {
    btn.classList.add('wrong');
    feedback.className = 'feedback show wrong';
    feedback.innerHTML = `✗ 正确答案：<span class="answer">${word.en}</span> — ${word.zh}`;
    addToMistakes(word);
    updateStats(false);
  }

  document.getElementById('scoreText').textContent = `${state.score} 分`;
  nextBtn.style.display = 'block';
  nextBtn.textContent = state.currentIndex >= state.words.length - 1 ? '查看结果' : '下一题';
}

// ===== 下一题 =====
document.getElementById('nextBtn').onclick = () => {
  if (state.currentIndex >= state.words.length - 1) {
    showResult();
  } else {
    state.currentIndex++;
    renderQuestion();
  }
};

function restartQuiz() {
  startQuiz(state.practiceMistakesOnly);
}

// ===== 统计更新 =====
function updateStats(isCorrect) {
  appData.stats.total++;
  if (isCorrect) appData.stats.correct++;
  const level = state.practiceMistakesOnly ? 'mistakes' : state.level;
  if (!appData.stats.byLevel[level]) appData.stats.byLevel[level] = { total: 0, correct: 0 };
  appData.stats.byLevel[level].total++;
  if (isCorrect) appData.stats.byLevel[level].correct++;
  saveData(appData);
}

function addToMistakes(word) {
  if (!appData.mistakes.find(m => m.en === word.en)) {
    appData.mistakes.push({ en: word.en, zh: word.zh });
    saveData(appData);
  }
}

// ===== 结果页 =====
function showResult() {
  const total = state.words.length;
  const score = state.score;
  const pct = Math.round((score / total) * 100);
  document.getElementById('resultScore').textContent = `${score} / ${total}`;
  document.getElementById('resultDetail').textContent = `正确率 ${pct}%${state.mistakes.length ? '' : '，太棒了，全对！'}`;
  showView('result');
}

// ===== 错词本 =====
function renderMistakes() {
  const list = document.getElementById('mistakeList');
  document.getElementById('mistakeCount').textContent = `${appData.mistakes.length} 个错词`;
  if (appData.mistakes.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:40px 0;font-size:14px">暂无错词，继续保持！</div>';
    return;
  }
  list.innerHTML = '';
  appData.mistakes.forEach((m, i) => {
    const item = document.createElement('div');
    item.className = 'word-item';
    item.innerHTML = `<div><div class="en">${m.en}</div><div class="zh">${m.zh}</div></div>
      <button class="del-btn" data-idx="${i}">✕</button>`;
    list.appendChild(item);
  });
  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = (e) => {
      const idx = parseInt(e.target.dataset.idx);
      appData.mistakes.splice(idx, 1);
      saveData(appData);
      renderMistakes();
    };
  });
}

document.getElementById('practiceMistakesBtn').onclick = () => {
  if (appData.mistakes.length === 0) {
    showToast('错词本是空的');
    return;
  }
  startQuiz(true);
};

// ===== 统计页 =====
function renderStats() {
  document.getElementById('statTotal').textContent = appData.stats.total;
  document.getElementById('statCorrect').textContent = appData.stats.correct;
  const rate = appData.stats.total > 0 ? Math.round((appData.stats.correct / appData.stats.total) * 100) : 0;
  document.getElementById('statRate').textContent = rate + '%';

  const levelStats = document.getElementById('levelStats');
  levelStats.innerHTML = '';
  for (const [key, bank] of Object.entries(WORD_BANKS)) {
    const s = appData.stats.byLevel[key];
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)';
    if (s) {
      const r = Math.round((s.correct / s.total) * 100);
      row.innerHTML = `<span style="font-weight:500">${bank.name}</span><span style="font-size:13px;color:var(--text-secondary)">${s.correct}/${s.total} (${r}%)</span>`;
    } else {
      row.innerHTML = `<span style="font-weight:500">${bank.name}</span><span style="font-size:13px;color:var(--text-secondary)">未开始</span>`;
    }
    levelStats.appendChild(row);
  }
}

// ===== Toast =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// 预加载语音合成 voices
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => {
    speechSynthesis.getVoices();
  };
}

// 启动
init();
</script>
